name: courseware

x-api-environment: &api-environment
  CW_DATABASE_URL: postgresql+psycopg://courseware:${CW_POSTGRES_PASSWORD:?Set CW_POSTGRES_PASSWORD}@db:5432/courseware
  CW_SECRET_KEY: ${CW_SECRET_KEY:?Set CW_SECRET_KEY}
  CW_PUBLIC_ORIGIN: ${CW_PUBLIC_ORIGIN:?Set the public HTTPS origin}
  CW_STORAGE_PATH: /srv/courseware
  CW_SECURE_COOKIES: "true"
  CW_X_ACCEL: "true"
  CW_ALLOWED_GIT_HOSTS: ${CW_ALLOWED_GIT_HOSTS:-github.com,farfarfun-cn-hangzhou.devops.aliyuncs.com}

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: courseware
      POSTGRES_DB: courseware
      POSTGRES_PASSWORD: ${CW_POSTGRES_PASSWORD:?Set CW_POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseware -d courseware"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: ../apps/courseware-api
    user: "0:0"
    environment: *api-environment
    command: ["sh", "-c", "mkdir -p /srv/courseware/releases /srv/courseware/work && chown 10001:10001 /srv/courseware /srv/courseware/releases /srv/courseware/work && alembic upgrade head"]
    volumes:
      - content:/srv/courseware
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ../apps/courseware-api
    environment: *api-environment
    volumes:
      - content:/srv/courseware:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: ../apps/courseware-api
    command: ["courseware", "worker"]
    env_file: ../.env
    environment: *api-environment
    volumes:
      - content:/srv/courseware
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build: ../apps/courseware-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CW_TLS_DIRECTORY:?Set certificate directory}:/etc/nginx/tls:ro
      - content:/srv/courseware:ro
    depends_on: [api]
    restart: unless-stopped

volumes:
  database:
  content:
